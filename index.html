<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Ajuste para pantalla completa y bordes seguros en celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>Control de Asistencia Estudiantil</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SheetJS para exportar a Excel sin errores -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        /* Adaptación para pantallas completas con notch o barra de estado */
        body {
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
            min-height: 100vh;
            background-color: #f8fafc;
        }

        /* Estilos para impresión */
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { padding: 0; background: white; }
            .card-shadow { box-shadow: none !important; border: 1px solid #e2e8f0; }
        }
    </style>
</head>
<body class="text-slate-800 font-sans antialiased">

    <!-- Notificación Toast -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 ease-out bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 no-print">
        <i id="toastIcon" data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400"></i>
        <span id="toastMsg" class="text-sm font-medium">Operación realizada</span>
    </div>

    <div class="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">

        <!-- ENCABEZADO Y BARRA PRINCIPAL -->
        <header class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="p-3 bg-indigo-600 text-white rounded-2xl shadow-md shadow-indigo-100">
                    <i data-lucide="graduation-cap" class="w-7 h-7"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Control de Asistencia</h1>
                    <div class="flex items-center gap-2 mt-0.5">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span> Auto-guardado activo
                        </span>
                        <span id="lastSavedText" class="text-xs text-slate-400 font-medium">Último cambio: Hoy</span>
                    </div>
                </div>
            </div>

            <!-- Acciones Principales -->
            <div class="flex items-center gap-2 flex-wrap no-print">
                <button onclick="guardarProgresoManual()" class="flex-1 md:flex-initial flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition-all shadow-sm">
                    <i data-lucide="save" class="w-4 h-4"></i> Guardar Día
                </button>
                <button onclick="exportarAExcel()" class="flex-1 md:flex-initial flex items-center justify-center gap-2 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200 px-4 py-2.5 rounded-xl font-medium text-sm transition-all">
                    <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Excel
                </button>
                <button onclick="window.print()" class="p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl transition-all" title="Imprimir o PDF">
                    <i data-lucide="printer" class="w-5 h-5"></i>
                </button>
                <button onclick="toggleAdminModal(true)" class="p-2.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-xl transition-all" title="Gestionar Estudiantes">
                    <i data-lucide="users" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <!-- NAVEGACIÓN DE FECHAS -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-3 no-print">
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <button onclick="cambiarFecha(-1)" class="p-2 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-600">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>
                <input type="date" id="fechaSelect" onchange="cargarFechaSeleccionada()" class="bg-slate-50 border border-slate-200 text-slate-800 text-sm font-semibold rounded-xl px-3 py-2 text-center focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-auto">
                <button onclick="cambiarFecha(1)" class="p-2 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-600">
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
                <button onclick="irAHoy()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition-all">
                    Hoy
                </button>
            </div>
            <div id="quickDates" class="flex items-center gap-1.5 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0 text-xs">
                <!-- Accesos rápidos generados por JS -->
            </div>
        </section>

        <!-- DASHBOARD DE RESUMEN POR GÉNERO -->
        <section class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <!-- Presentes -->
            <div class="bg-white rounded-2xl p-4 border border-emerald-100 shadow-sm relative overflow-hidden">
                <div class="flex justify-between items-start mb-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-emerald-600">Presentes</span>
                    <i data-lucide="user-check" class="w-4 h-4 text-emerald-500"></i>
                </div>
                <div id="statPresentes" class="text-2xl font-extrabold text-slate-900">0</div>
                <div class="mt-2 pt-2 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                    <span>M: <strong id="statPresentesM" class="text-slate-800">0</strong></span>
                    <span>F: <strong id="statPresentesF" class="text-slate-800">0</strong></span>
                </div>
            </div>

            <!-- Salud -->
            <div class="bg-white rounded-2xl p-4 border border-blue-100 shadow-sm relative overflow-hidden">
                <div class="flex justify-between items-start mb-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-blue-600">Permiso Salud</span>
                    <i data-lucide="heart-pulse" class="w-4 h-4 text-blue-500"></i>
                </div>
                <div id="statSalud" class="text-2xl font-extrabold text-slate-900">0</div>
                <div class="mt-2 pt-2 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                    <span>M: <strong id="statSaludM" class="text-slate-800">0</strong></span>
                    <span>F: <strong id="statSaludF" class="text-slate-800">0</strong></span>
                </div>
            </div>

            <!-- Personal -->
            <div class="bg-white rounded-2xl p-4 border border-amber-100 shadow-sm relative overflow-hidden">
                <div class="flex justify-between items-start mb-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-amber-600">Permiso Personal</span>
                    <i data-lucide="user-minus" class="w-4 h-4 text-amber-500"></i>
                </div>
                <div id="statPersonal" class="text-2xl font-extrabold text-slate-900">0</div>
                <div class="mt-2 pt-2 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                    <span>M: <strong id="statPersonalM" class="text-slate-800">0</strong></span>
                    <span>F: <strong id="statPersonalF" class="text-slate-800">0</strong></span>
                </div>
            </div>

            <!-- Sin Justificar -->
            <div class="bg-white rounded-2xl p-4 border border-rose-100 shadow-sm relative overflow-hidden">
                <div class="flex justify-between items-start mb-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-rose-600">Sin Justificar</span>
                    <i data-lucide="user-x" class="w-4 h-4 text-rose-500"></i>
                </div>
                <div id="statAusentes" class="text-2xl font-extrabold text-slate-900">0</div>
                <div class="mt-2 pt-2 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                    <span>M: <strong id="statAusentesM" class="text-slate-800">0</strong></span>
                    <span>F: <strong id="statAusentesF" class="text-slate-800">0</strong></span>
                </div>
            </div>
        </section>

        <!-- RESUMEN GENERAL -->
        <section class="bg-white rounded-2xl p-4 border border-slate-100 shadow-sm flex items-center justify-between text-xs sm:text-sm">
            <div class="flex items-center gap-2">
                <span class="font-bold text-slate-700">Total de Estudiantes:</span>
                <span id="statTotal" class="bg-slate-100 text-slate-800 font-extrabold px-2.5 py-1 rounded-lg">0</span>
            </div>
            <div class="flex items-center gap-4 text-slate-500">
                <span>Hombres (M): <strong id="statTotalM" class="text-slate-800">0</strong></span>
                <span>Mujeres (F): <strong id="statTotalF" class="text-slate-800">0</strong></span>
            </div>
        </section>

        <!-- CONTROL Y REGISTRO DE ASISTENCIA -->
        <section class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-4 sm:p-5 border-b border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-3 no-print">
                <div class="relative w-full sm:w-72">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="renderizarLista()" placeholder="Buscar estudiante..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <button onclick="marcarTodos('Presente')" class="text-xs bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200 font-semibold px-3 py-2 rounded-xl transition-all">
                        Todos Presentes
                    </button>
                    <button onclick="marcarTodos('Ausente')" class="text-xs bg-rose-50 text-rose-700 hover:bg-rose-100 border border-rose-200 font-semibold px-3 py-2 rounded-xl transition-all">
                        Restantes Ausentes
                    </button>
                </div>
            </div>

            <!-- Lista de Estudiantes -->
            <div class="divide-y divide-slate-100 max-h-[60vh] overflow-y-auto" id="estudiantesList">
                <!-- Se llena dinámicamente con JS -->
            </div>
        </section>
    </div>

    <!-- MODAL DE GESTIÓN DE ESTUDIANTES (ADMIN) -->
    <div id="adminModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 no-print">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-5">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                    <i data-lucide="users" class="w-5 h-5 text-indigo-600"></i> Gestión de Estudiantes
                </h3>
                <button onclick="toggleAdminModal(false)" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <!-- Formulario para agregar -->
            <form onsubmit="agregarEstudiante(event)" class="space-y-3 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre Completo</label>
                    <input type="text" id="nuevoNombre" required placeholder="Ej. Juan Pérez" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex gap-3">
                    <div class="flex-1">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Género</label>
                        <select id="nuevoGenero" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="M">Masculino (M)</option>
                            <option value="F">Femenino (F)</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm px-4 py-2 rounded-xl transition-all flex items-center gap-2">
                            <i data-lucide="plus" class="w-4 h-4"></i> Agregar
                        </button>
                    </div>
                </div>
            </form>

            <!-- Acciones de Limpieza -->
            <div class="border-t border-slate-100 pt-4 flex items-center justify-between">
                <button onclick="cargarEstudiantesEjemplo()" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">
                    Restaurar Lista Ejemplo
                </button>
                <button onclick="borrarListaEstudiantes()" class="text-xs text-rose-600 hover:text-rose-800 font-medium">
                    Borrar Toda la Lista
                </button>
            </div>
        </div>
    </div>

    <!-- LOGICA JAVASCRIPT -->
    <script>
        // Lista inicial por defecto si la base de datos está vacía
        const ESTUDIANTES_EJEMPLO = [
            { id: '1', nombre: 'Carlos Eduardo Ramírez', genero: 'M' },
            { id: '2', nombre: 'María Fernanda Gómez', genero: 'F' },
            { id: '3', nombre: 'José Luis Hernández', genero: 'M' },
            { id: '4', nombre: 'Ana Sofía Martínez', genero: 'F' },
            { id: '5', nombre: 'Diego Alejandro Torres', genero: 'M' },
            { id: '6', nombre: 'Valeria Isabel Castillo', genero: 'F' }
        ];

        let estudiantes = [];
        let registroAsistencia = {}; // Estructura: { "YYYY-MM-DD": { idEstudiante: { estado: 'Presente', nota: '' } } }
        let fechaActual = new Date().toISOString().split('T')[0];

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            inicializarDatos();
            document.getElementById('fechaSelect').value = fechaActual;
            renderizarMenuFechas();
            renderizarLista();
            lucide.createIcons();
        });

        function inicializarDatos() {
            const rawEstudiantes = localStorage.getItem('asistencia_estudiantes');
            if (rawEstudiantes) {
                estudiantes = JSON.parse(rawEstudiantes);
            } else {
                estudiantes = [...ESTUDIANTES_EJEMPLO];
                localStorage.setItem('asistencia_estudiantes', JSON.stringify(estudiantes));
            }

            const rawAsistencia = localStorage.getItem('asistencia_registros');
            if (rawAsistencia) {
                registroAsistencia = JSON.parse(rawAsistencia);
            }
        }

        function guardarEnLocalStorage() {
            localStorage.setItem('asistencia_estudiantes', JSON.stringify(estudiantes));
            localStorage.setItem('asistencia_registros', JSON.stringify(registroAsistencia));
            actualizarTextoUltimoGuardado();
        }

        function actualizarTextoUltimoGuardado() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('lastSavedText').innerText = `Auto-guardado: ${timeStr}`;
        }

        function irAHoy() {
            fechaActual = new Date().toISOString().split('T')[0];
            document.getElementById('fechaSelect').value = fechaActual;
            renderizarLista();
        }

        function cambiarFecha(dias) {
            const dateObj = new Date(fechaActual + 'T00:00:00');
            dateObj.setDate(dateObj.getDate() + dias);
            fechaActual = dateObj.toISOString().split('T')[0];
            document.getElementById('fechaSelect').value = fechaActual;
            renderizarLista();
        }

        function cargarFechaSeleccionada() {
            fechaActual = document.getElementById('fechaSelect').value;
            renderizarLista();
        }

        function renderizarMenuFechas() {
            const container = document.getElementById('quickDates');
            container.innerHTML = '';
            const hoy = new Date();
            
            for (let i = 4; i >= 0; i--) {
                const d = new Date(hoy);
                d.setDate(d.getDate() - i);
                const iso = d.toISOString().split('T')[0];
                const nomDia = d.toLocaleDateString('es-ES', { weekday: 'short' });
                
                const btn = document.createElement('button');
                btn.className = `px-2.5 py-1 rounded-lg border font-medium transition-all ${iso === fechaActual ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}`;
                btn.innerText = i === 0 ? 'Hoy' : `${nomDia} ${d.getDate()}`;
                btn.onclick = () => {
                    fechaActual = iso;
                    document.getElementById('fechaSelect').value = iso;
                    renderizarMenuFechas();
                    renderizarLista();
                };
                container.appendChild(btn);
            }
        }

        function cambiarEstado(idEstudiante, nuevoEstado) {
            if (!registroAsistencia[fechaActual]) {
                registroAsistencia[fechaActual] = {};
            }
            if (!registroAsistencia[fechaActual][idEstudiante]) {
                registroAsistencia[fechaActual][idEstudiante] = { estado: 'Sin marcar', nota: '' };
            }

            registroAsistencia[fechaActual][idEstudiante].estado = nuevoEstado;
            guardarEnLocalStorage();
            renderizarLista();
        }

        function guardarNota(idEstudiante, nota) {
            if (!registroAsistencia[fechaActual]) registroAsistencia[fechaActual] = {};
            if (!registroAsistencia[fechaActual][idEstudiante]) {
                registroAsistencia[fechaActual][idEstudiante] = { estado: 'Sin marcar', nota: '' };
            }
            registroAsistencia[fechaActual][idEstudiante].nota = nota;
            guardarEnLocalStorage();
        }

        function marcarTodos(estado) {
            if (!registroAsistencia[fechaActual]) registroAsistencia[fechaActual] = {};
            estudiantes.forEach(est => {
                if (!registroAsistencia[fechaActual][est.id] || registroAsistencia[fechaActual][est.id].estado === 'Sin marcar') {
                    registroAsistencia[fechaActual][est.id] = {
                        estado: estado,
                        nota: registroAsistencia[fechaActual][est.id]?.nota || ''
                    };
                }
            });
            guardarEnLocalStorage();
            renderizarLista();
            mostrarToast(`Registrados como: ${estado}`);
        }

        function renderizarLista() {
            renderizarMenuFechas();
            const busqueda = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('estudiantesList');
            container.innerHTML = '';

            const registroDia = registroAsistencia[fechaActual] || {};

            // Contadores
            let stats = {
                Presente: { M: 0, F: 0 },
                Salud: { M: 0, F: 0 },
                Personal: { M: 0, F: 0 },
                Ausente: { M: 0, F: 0 },
                Total: { M: 0, F: 0 }
            };

            const estudiantesFiltrados = estudiantes.filter(e => e.nombre.toLowerCase().includes(busqueda));

            estudiantes.forEach(est => {
                const genero = est.genero || 'M';
                stats.Total[genero]++;

                const st = registroDia[est.id]?.estado || 'Sin marcar';
                if (st === 'Presente') stats.Presente[genero]++;
                else if (st === 'Permiso Salud') stats.Salud[genero]++;
                else if (st === 'Permiso Personal') stats.Personal[genero]++;
                else if (st === 'Ausente') stats.Ausente[genero]++;
            });

            // Actualizar KPIs en el Dashboard
            document.getElementById('statPresentes').innerText = stats.Presente.M + stats.Presente.F;
            document.getElementById('statPresentesM').innerText = stats.Presente.M;
            document.getElementById('statPresentesF').innerText = stats.Presente.F;

            document.getElementById('statSalud').innerText = stats.Salud.M + stats.Salud.F;
            document.getElementById('statSaludM').innerText = stats.Salud.M;
            document.getElementById('statSaludF').innerText = stats.Salud.F;

            document.getElementById('statPersonal').innerText = stats.Personal.M + stats.Personal.F;
            document.getElementById('statPersonalM').innerText = stats.Personal.M;
            document.getElementById('statPersonalF').innerText = stats.Personal.F;

            document.getElementById('statAusentes').innerText = stats.Ausente.M + stats.Ausente.F;
            document.getElementById('statAusentesM').innerText = stats.Ausente.M;
            document.getElementById('statAusentesF').innerText = stats.Ausente.F;

            document.getElementById('statTotal').innerText = stats.Total.M + stats.Total.F;
            document.getElementById('statTotalM').innerText = stats.Total.M;
            document.getElementById('statTotalF').innerText = stats.Total.F;

            if (estudiantesFiltrados.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center text-slate-400 text-sm">
                        No se encontraron estudiantes registrados.
                    </div>
                `;
                return;
            }

            estudiantesFiltrados.forEach((est, idx) => {
                const reg = registroDia[est.id] || { estado: 'Sin marcar', nota: '' };
                const div = document.createElement('div');
                div.className = 'p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-slate-50/80 transition-all';
                
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-bold text-slate-400 w-5">${idx + 1}.</span>
                        <div>
                            <div class="font-semibold text-slate-900 text-sm flex items-center gap-2">
                                ${est.nombre}
                                <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${est.genero === 'M' ? 'bg-blue-50 text-blue-600' : 'bg-pink-50 text-pink-600'}">
                                    ${est.genero}
                                </span>
                            </div>
                            <input type="text" placeholder="Agregar nota o motivo..." value="${reg.nota || ''}" 
                                onchange="guardarNota('${est.id}', this.value)"
                                class="mt-1 text-xs text-slate-500 bg-transparent border-b border-transparent hover:border-slate-200 focus:border-indigo-500 focus:outline-none w-full sm:w-64">
                        </div>
                    </div>

                    <div class="flex items-center gap-1 overflow-x-auto pb-1 sm:pb-0 no-print">
                        <button onclick="cambiarEstado('${est.id}', 'Presente')" class="px-2.5 py-1.5 rounded-xl text-xs font-semibold transition-all ${reg.estado === 'Presente' ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-emerald-50 hover:text-emerald-700'}">
                            Presente
                        </button>
                        <button onclick="cambiarEstado('${est.id}', 'Permiso Salud')" class="px-2.5 py-1.5 rounded-xl text-xs font-semibold transition-all ${reg.estado === 'Permiso Salud' ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-blue-50 hover:text-blue-700'}">
                            Salud
                        </button>
                        <button onclick="cambiarEstado('${est.id}', 'Permiso Personal')" class="px-2.5 py-1.5 rounded-xl text-xs font-semibold transition-all ${reg.estado === 'Permiso Personal' ? 'bg-amber-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-amber-50 hover:text-amber-700'}">
                            Personal
                        </button>
                        <button onclick="cambiarEstado('${est.id}', 'Ausente')" class="px-2.5 py-1.5 rounded-xl text-xs font-semibold transition-all ${reg.estado === 'Ausente' ? 'bg-rose-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-rose-50 hover:text-rose-700'}">
                            Ausente
                        </button>
                    </div>
                `;
                container.appendChild(div);
            });

            lucide.createIcons();
        }

        // Exportación a Excel Segura para Celulares
      function exportarAExcel() {
            try {
                const registroDia = registroAsistencia[fechaActual] || {};
                const datos = [
                    ["REPORTE DE ASISTENCIA ESCOLAR"],
                    ["Fecha:", fechaActual],
                    [],
                    ["N°", "Estudiante", "Género", "Estado", "Justificación / Observaciones"]
                ];

                estudiantes.forEach((est, index) => {
                    const reg = registroDia[est.id] || { estado: 'Sin marcar', nota: '' };
                    datos.push([
                        index + 1,
                        est.nombre,
                        est.genero === 'M' ? 'Masculino' : 'Femenino',
                        reg.estado,
                        reg.nota || ''
                    ]);
                });

                if (typeof XLSX !== 'undefined') {
                    const wb = XLSX.utils.book_new();
                    const ws = XLSX.utils.aoa_to_sheet(datos);
                    XLSX.utils.book_append_sheet(wb, ws, "Asistencia");
                    XLSX.writeFile(wb, `Asistencia_${fechaActual}.xlsx`);
                    mostrarToast("Excel generado con éxito");
                } else {  
                    // Descarga alternativa tipo CSV
                    let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
                    datos.forEach(row => { csvContent += row.map(e => `"${e}"`).join(",") + "\n"; });
                    const encodedUri = encodeURI(csvContent);
                    const link = document.createElement("a");
                    link.setAttribute("href", encodedUri);
                    link.setAttribute("download", `Asistencia_${fechaActual}.csv`);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    mostrarToast("CSV generado con éxito");
                }
            } catch (err) {
                alert("Error al descargar reporte: " + err.message);
            }
        }

        function guardarProgresoManual() {
            guardarEnLocalStorage();
            mostrarToast("Registro del día guardado");
        }

        function toggleAdminModal(show) {
            document.getElementById('adminModal').classList.toggle('hidden', !show);
        }

        function agregarEstudiante(e) {
            e.preventDefault();
            const nombre = document.getElementById('nuevoNombre').value.trim();
            const genero = document.getElementById('nuevoGenero').value;
            if (!nombre) return;

            estudiantes.push({
                id: Date.now().toString(),
                nombre: nombre,
                genero: genero
            });

            document.getElementById('nuevoNombre').value = '';
            guardarEnLocalStorage();
            renderizarLista();
            mostrarToast("Estudiante agregado");
        }

        function borrarListaEstudiantes() {
            if (confirm("¿Estás seguro de borrar toda la lista de estudiantes?")) {
                estudiantes = [];
                guardarEnLocalStorage();
                renderizarLista();
                mostrarToast("Lista eliminada");
            }
        }

        function cargarEstudiantesEjemplo() {
            estudiantes = [...ESTUDIANTES_EJEMPLO];
            guardarEnLocalStorage();
            renderizarLista();
            mostrarToast("Lista de ejemplo cargada");
        }

        function mostrarToast(mensaje) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = mensaje;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
